name: macOS app

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Lint package scripts
        run: |
          brew list shellcheck >/dev/null 2>&1 || brew install shellcheck
          shellcheck scripts/package.sh tests/test_package.sh
      - name: Run Swift tests
        run: swift test
      - name: Build and verify universal app archive
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            ./tests/test_package.sh "${GITHUB_REF_NAME#v}"
          else
            ./tests/test_package.sh
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Launcher-macOS
          path: |
            dist/DeepSeek-Harness-Launcher-macOS.zip
            dist/DeepSeek-Harness-Launcher-macOS.zip.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-package
    runs-on: macos-15
    environment: release
    timeout-minutes: 70
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Import Developer ID and create notary profile
        shell: bash
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${CERTIFICATE_P12_BASE64:?Set MACOS_CERTIFICATE_P12_BASE64 in the release environment}"
          : "${CERTIFICATE_PASSWORD:?Set MACOS_CERTIFICATE_PASSWORD in the release environment}"
          keychain="$RUNNER_TEMP/release-signing.keychain-db"
          p12="$RUNNER_TEMP/release-signing.p12"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 -D > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          identities="$(security find-identity -v -p codesigning "$keychain")"
          [[ "$identities" == *'Developer ID Application: Yushen Chang (M22Z394H44)'* ]] || {
            echo 'error: Developer ID Application identity was not imported' >&2
            exit 1
          }

          if [[ -n "$NOTARY_API_KEY_P8_BASE64" ]]; then
            : "${NOTARY_API_KEY_ID:?Set APPLE_NOTARY_API_KEY_ID}"
            key="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$NOTARY_API_KEY_P8_BASE64" | base64 -D > "$key"
            notary_args=(--key "$key" --key-id "$NOTARY_API_KEY_ID")
            if [[ -n "$NOTARY_API_ISSUER_ID" ]]; then notary_args+=(--issuer "$NOTARY_API_ISSUER_ID"); fi
            xcrun notarytool store-credentials ci-notary "${notary_args[@]}" --keychain "$keychain"
            unlink "$key"
          else
            : "${NOTARY_APPLE_ID:?Set APPLE_NOTARY_APPLE_ID or an API key}"
            : "${NOTARY_APP_PASSWORD:?Set APPLE_NOTARY_APP_PASSWORD}"
            xcrun notarytool store-credentials ci-notary \
              --apple-id "$NOTARY_APPLE_ID" --team-id M22Z394H44 \
              --password "$NOTARY_APP_PASSWORD" --keychain "$keychain"
          fi
          unlink "$p12"
          echo "CODESIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Build, notarize, and verify release archive
        env:
          CODESIGN_IDENTITY: 'Developer ID Application: Yushen Chang (M22Z394H44)'
          NOTARY_PROFILE: ci-notary
        run: ./tests/test_package.sh "${GITHUB_REF_NAME#v}"
      - name: Publish notarized release archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            dist/DeepSeek-Harness-Launcher-macOS.zip \
            dist/DeepSeek-Harness-Launcher-macOS.zip.sha256 \
            --generate-notes --repo "$GITHUB_REPOSITORY"
      - name: Remove temporary signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release-signing.keychain-db" || true
          if [[ -f "$RUNNER_TEMP/release-signing.p12" ]]; then unlink "$RUNNER_TEMP/release-signing.p12"; fi
          if [[ -f "$RUNNER_TEMP/AuthKey.p8" ]]; then unlink "$RUNNER_TEMP/AuthKey.p8"; fi
