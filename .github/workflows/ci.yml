name: macOS app

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Lint package scripts
        run: |
          brew list shellcheck >/dev/null 2>&1 || brew install shellcheck
          shellcheck scripts/package.sh tests/test_package.sh
      - name: Run Swift tests
        run: swift test
      - name: Build and verify universal app archive
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            ./tests/test_package.sh "${GITHUB_REF_NAME#v}"
          else
            ./tests/test_package.sh
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Launcher-macOS
          path: |
            dist/DeepSeek-Harness-Launcher-macOS.zip
            dist/DeepSeek-Harness-Launcher-macOS.zip.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-package
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DeepSeek-Harness-Launcher-macOS
          path: dist
      - name: Publish release archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            dist/DeepSeek-Harness-Launcher-macOS.zip \
            dist/DeepSeek-Harness-Launcher-macOS.zip.sha256 \
            --generate-notes --repo "$GITHUB_REPOSITORY"
